<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hồ sơ tài khoản | Tinh Hoa Tây Bắc</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/features.css"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="feature-main"><nav class="feature-nav"><a href="/account">Tài khoản</a><a href="/account/profile">Hồ sơ</a><a href="/account/addresses">Địa chỉ</a><a href="/account/orders">Đơn hàng</a><a href="/account/notifications">Thông báo</a><a href="/wallet">Ví Tinh Hoa</a></nav><h1>Hồ sơ tài khoản</h1><p class="notice success" th:if="${success}" th:text="${success}"></p><p class="notice error" th:if="${error}" th:text="${error}"></p><section class="feature-card"><form class="feature-form" th:action="@{/account/profile}" method="post" enctype="multipart/form-data"><label>Họ tên<input name="fullName" th:value="${user.fullName}" required></label><label>Email<input th:value="${user.email}" disabled></label><label>Điện thoại<input name="phone" th:value="${user.phone}"></label><label>Địa chỉ<input name="address" th:value="${user.address}"></label><label>Ảnh đại diện (đường dẫn)<input name="avatar" th:value="${user.avatar}"></label><label>Tải ảnh đại diện<input type="file" name="avatarFile" accept="image/png,image/jpeg"></label><button>Lưu hồ sơ</button></form></section><section class="feature-card"><h2>Đổi mật khẩu</h2><form class="feature-form" th:action="@{/account/password}" method="post"><label>Mật khẩu hiện tại<input name="currentPassword" type="password" required autocomplete="current-password"></label><label>Mật khẩu mới<input name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></label><label>Xác nhận mật khẩu<input name="passwordConfirmation" type="password" required autocomplete="new-password"></label><button>Đổi mật khẩu</button></form></section><section class="feature-card"><h2>Xác thực email</h2><p th:if="${user.emailVerifiedAt != null}">Email đã được xác thực.</p><div th:if="${user.emailVerifiedAt == null}"><form th:action="@{/account/verify-email/send}" method="post"><button>Gửi mã xác thực</button></form><form class="feature-form" th:action="@{/account/verify-email}" method="post"><label>Mã 6 số<input name="code" pattern="[0-9]{6}" required></label><button>Xác thực</button></form></div></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
