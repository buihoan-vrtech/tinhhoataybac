<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Địa chỉ nhận hàng | Tinh Hoa Tây Bắc</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/features.css"><link rel="stylesheet" href="/css/registration.css"><link rel="stylesheet" href="/css/account.css?v=20261010"></head><body class="account-area"><div th:replace="~{fragments/header :: header}"></div><main class="feature-main"><nav class="feature-nav"><a href="/account">Tài khoản</a><a href="/account/profile">Hồ sơ</a><a class="active" href="/account/addresses">Địa chỉ</a><a href="/account/orders">Đơn hàng</a><a href="/account/notifications">Thông báo</a><a href="/wallet">Ví Tinh Hoa</a></nav><h1>Địa chỉ nhận hàng</h1><p class="notice success" th:if="${success}" th:text="${success}"></p><p class="notice error" th:if="${error}" th:text="${error}"></p><section class="feature-card"><form class="feature-form" th:action="@{/account/addresses/save}" method="post" th:object="${address}"><input type="hidden" th:field="*{id}"><label>Nhãn<input th:field="*{label}"></label><label>Người nhận<input th:field="*{receiverName}" required></label><label>Điện thoại<input th:field="*{phone}" required></label><label>Tỉnh / thành<input th:field="*{province}"></label><label>Quận / huyện<input th:field="*{district}"></label><label>Phường / xã<input th:field="*{ward}"></label><label>Địa chỉ chi tiết<input th:field="*{addressDetail}" data-address-search data-address-structured maxlength="500" required></label><label><span><input type="checkbox" th:field="*{defaultAddress}"> Địa chỉ mặc định</span></label><button>Lưu địa chỉ</button></form></section><section class="feature-card" th:each="a:${addresses}"><h2 th:text="${a.label + (a.defaultAddress ? ' · Mặc định' : '')}"></h2><p th:text="${a.receiverName + ' · ' + a.phone}"></p><p th:text="${a.addressDetail}"></p><a th:href="@{/account/addresses(edit=${a.id})}">Sửa</a><form th:action="@{/account/addresses/{id}/default(id=${a.id})}" method="post"><button>Đặt mặc định</button></form><form th:action="@{/account/addresses/{id}/delete(id=${a.id})}" method="post" onsubmit="return confirm('Xóa địa chỉ này?')"><button>Xóa</button></form></section></main><div th:replace="~{fragments/footer :: footer}"></div><script src="/js/address-search.js"></script></body></html>
