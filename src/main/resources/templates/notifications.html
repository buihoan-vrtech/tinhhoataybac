<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thông báo | Tinh Hoa Tây Bắc</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/features.css"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="feature-main"><nav class="feature-nav"><a href="/account">Tài khoản</a><a href="/account/profile">Hồ sơ</a><a href="/account/addresses">Địa chỉ</a><a href="/account/orders">Đơn hàng</a><a href="/account/notifications">Thông báo</a><a href="/wallet">Ví Tinh Hoa</a></nav><h1>Thông báo</h1><p class="notice success" th:if="${success}" th:text="${success}"></p><p class="notice error" th:if="${error}" th:text="${error}"></p><form th:action="@{/account/notifications/read-all}" method="post"><button>Đánh dấu tất cả đã đọc</button></form><p th:if="${notifications.isEmpty()}">Bạn chưa có thông báo.</p><section class="feature-card" th:each="n:${notifications}"><strong th:text="${n.readFlag ? 'Đã đọc' : 'Mới'}"></strong><p th:text="${n.message}"></p><small th:text="${n.createdAt}"></small><form th:action="@{/account/notifications/{id}/read(id=${n.id})}" method="post"><button>Xem chi tiết</button></form></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
