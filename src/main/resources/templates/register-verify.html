<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xác minh email | Tinh Hoa Tây Bắc</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/registration.css"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="auth-v2-page"><section class="auth-v2-card" style="max-width:480px;padding:36px"><p style="color:#527448;font-weight:700">BƯỚC 2 · XÁC MINH EMAIL</p><h1>Kiểm tra hộp thư của bạn</h1><p>Mã 6 số đã được gửi tới <strong th:text="${maskedEmail}"></strong>.</p><p style="color:#758170">Mã có hiệu lực 10 phút. Nếu chưa thấy thư, hãy kiểm tra mục Spam.</p><p role="alert" th:if="${error}" th:text="${error}" style="color:#a13232"></p><p role="status" th:if="${success}" th:text="${success}" style="color:#377344"></p><form th:action="@{/register/verify}" method="post"><label for="code">Mã xác minh</label><input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required autofocus style="display:block;width:100%;box-sizing:border-box;padding:16px;margin:12px 0 20px;border:1px solid #ccd8c6;border-radius:12px;font-size:25px;letter-spacing:8px;text-align:center"><button class="auth-v2-submit" type="submit">Xác minh &amp; tạo tài khoản →</button></form><form th:action="@{/register/verify/resend}" method="post" style="margin:20px 0"><button type="submit" style="background:none;border:0;color:#3e6b3d;cursor:pointer;text-decoration:underline">Gửi lại mã</button><small style="display:block;margin-top:8px;color:#758170">Mỗi lần gửi cách nhau ít nhất 60 giây.</small></form><a href="/register">← Đổi email hoặc thông tin đăng ký</a></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
