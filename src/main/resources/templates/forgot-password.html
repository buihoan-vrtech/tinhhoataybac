<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khôi phục mật khẩu | Tinh Hoa Tây Bắc</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/features.css"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="feature-main"><nav class="feature-nav"><a href="/account">Tài khoản</a><a href="/account/profile">Hồ sơ</a><a href="/account/addresses">Địa chỉ</a><a href="/account/orders">Đơn hàng</a><a href="/account/notifications">Thông báo</a><a href="/wallet">Ví Tinh Hoa</a></nav><h1>Khôi phục mật khẩu</h1><p class="notice success" th:if="${success}" th:text="${success}"></p><p class="notice error" th:if="${error}" th:text="${error}"></p><section class="feature-card"><h2>Nhận mã qua email</h2><form class="feature-form" th:action="@{/forgot-password}" method="post"><label>Email tài khoản<input name="email" type="email" required></label><button>Gửi mã xác nhận</button></form></section><section class="feature-card"><h2>Đặt mật khẩu mới</h2><form class="feature-form" th:action="@{/reset-password}" method="post"><label>Email<input name="email" type="email" required></label><label>Mã 6 số<input name="code" pattern="[0-9]{6}" required autocomplete="one-time-code"></label><label>Mật khẩu mới<input name="password" type="password" minlength="8" maxlength="72" required></label><label>Nhập lại mật khẩu<input name="confirmation" type="password" required></label><button>Đặt lại mật khẩu</button></form></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
