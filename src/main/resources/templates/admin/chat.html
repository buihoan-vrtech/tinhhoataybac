<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat khách hàng | Tinh Hoa Tây Bắc</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/features.css"><link rel="stylesheet" href="/css/shop-chat.css"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="feature-main"><a href="/admin/dashboard">← Quản trị</a><h1>Hộp thư khách hàng</h1><p>Trả lời khách hàng và theo dõi tin chưa đọc. Hiển thị 100 hội thoại gần nhất.</p><div class="chat-admin" id="chat-admin"><aside id="chat-inbox" aria-label="Hội thoại"></aside><section class="chat-admin-thread"><h2 id="chat-customer-title">Chọn một hội thoại</h2><div class="chat-messages" id="admin-chat-messages" role="log" aria-live="polite"></div><p id="admin-chat-error" role="alert"></p><form id="admin-chat-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="chat-sr-only" for="admin-chat-content">Tin nhắn trả lời</label><textarea id="admin-chat-content" name="content" maxlength="1200" rows="2" required placeholder="Nhập trả lời khách hàng…"></textarea><button type="submit" disabled>Gửi trả lời</button></form></section></div></main><script src="/js/shop-chat.js"></script><div th:replace="~{fragments/footer :: footer}"></div></body></html>
