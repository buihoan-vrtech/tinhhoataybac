<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý voucher | Tinh Hoa Tây Bắc</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/features.css"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="feature-main"><nav class="feature-nav"><a href="/admin/dashboard">Tổng quan</a><a href="/admin/products">Sản phẩm</a><a href="/admin/categories">Danh mục</a><a href="/admin/orders">Đơn hàng</a><a href="/admin/vouchers">Voucher</a><a href="/admin/service-requests">Hủy / hoàn tiền</a><a href="/admin/wallets">Ví</a><a href="/admin/customers">Khách hàng</a><a href="/admin/reviews">Đánh giá</a></nav><h1>Quản lý voucher</h1><p class="notice success" th:if="${success}" th:text="${success}"></p><p class="notice error" th:if="${error}" th:text="${error}"></p><section class="feature-card"><form class="feature-form" th:action="@{/admin/vouchers/save}" method="post" th:object="${voucher}"><input type="hidden" th:field="*{id}"><label>Mã<input th:field="*{code}" required></label><label>Tên<input th:field="*{name}" required></label><label>Loại<select th:field="*{type}"><option value="fixed">Giảm tiền</option><option value="percent">Giảm %</option><option value="shipping">Giảm phí giao hàng</option></select></label><label>Giá trị<input type="number" min="0" th:field="*{value}" required></label><label>Đơn tối thiểu<input type="number" min="0" th:field="*{minOrderValue}"></label><label>Giảm tối đa<input type="number" min="0" th:field="*{maxDiscount}"></label><label>Giới hạn lượt<input type="number" min="1" th:field="*{usageLimit}"></label><label>Bắt đầu<input type="datetime-local" th:field="*{startsAt}"></label><label>Hết hạn<input type="datetime-local" th:field="*{expiresAt}"></label><label><span><input type="checkbox" th:field="*{active}"> Đang hoạt động</span></label><button>Lưu voucher</button></form></section><section class="feature-card"><table><thead><tr><th>Mã</th><th>Loại</th><th>Giá trị</th><th>Đã dùng</th><th>Hoạt động</th><th></th></tr></thead><tbody><tr th:each="v:${vouchers}"><td th:text="${v.code}"></td><td th:text="${v.type}"></td><td th:text="${v.value}"></td><td th:text="${v.usedCount}"></td><td th:text="${v.active}"></td><td><a th:href="@{/admin/vouchers(edit=${v.id})}">Sửa</a><form th:action="@{/admin/vouchers/{id}/disable(id=${v.id})}" method="post"><button>Ngừng sử dụng</button></form></td></tr></tbody></table></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
