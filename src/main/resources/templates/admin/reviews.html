<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý đánh giá | Tinh Hoa Tây Bắc</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/features.css"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="feature-main"><nav class="feature-nav"><a href="/admin/dashboard">Tổng quan</a><a href="/admin/products">Sản phẩm</a><a href="/admin/categories">Danh mục</a><a href="/admin/orders">Đơn hàng</a><a href="/admin/vouchers">Voucher</a><a href="/admin/service-requests">Hủy / hoàn tiền</a><a href="/admin/wallets">Ví</a><a href="/admin/customers">Khách hàng</a><a href="/admin/reviews">Đánh giá</a></nav><h1>Quản lý đánh giá</h1><p class="notice success" th:if="${success}" th:text="${success}"></p><p class="notice error" th:if="${error}" th:text="${error}"></p><section class="feature-card" th:each="r:${reviews}"><h2 th:text="${r.product.name + ' · ' + r.rating + '/5'}"></h2><p th:text="${r.user.fullName}"></p><p th:text="${r.comment}"></p><form th:action="@{/admin/reviews/{id}/delete(id=${r.id})}" method="post" onsubmit="return confirm('Xóa đánh giá này?')"><button>Xóa đánh giá</button></form></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
