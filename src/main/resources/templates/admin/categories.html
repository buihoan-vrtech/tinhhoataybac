<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý danh mục | Tinh Hoa Tây Bắc</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/features.css"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="feature-main"><nav class="feature-nav"><a href="/admin/dashboard">Tổng quan</a><a href="/admin/products">Sản phẩm</a><a href="/admin/categories">Danh mục</a><a href="/admin/orders">Đơn hàng</a><a href="/admin/vouchers">Voucher</a><a href="/admin/service-requests">Hủy / hoàn tiền</a><a href="/admin/wallets">Ví</a><a href="/admin/customers">Khách hàng</a><a href="/admin/reviews">Đánh giá</a></nav><h1>Quản lý danh mục</h1><p class="notice success" th:if="${success}" th:text="${success}"></p><p class="notice error" th:if="${error}" th:text="${error}"></p><section class="feature-card"><form class="feature-form" th:action="@{/admin/categories/save}" method="post" th:object="${category}"><input type="hidden" th:field="*{id}"><label>Tên<input th:field="*{name}" required></label><label>Mô tả<input th:field="*{description}"></label><button>Lưu danh mục</button></form></section><section class="feature-card"><table><tr th:each="c:${categories}"><td th:text="${c.name}"></td><td th:text="${c.description}"></td><td><a th:href="@{/admin/categories(edit=${c.id})}">Sửa</a><form th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post" onsubmit="return confirm('Xóa danh mục này?')"><button>Xóa</button></form></td></tr></table></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
