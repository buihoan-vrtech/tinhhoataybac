<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yêu cầu hủy / hoàn tiền | Tinh Hoa Tây Bắc</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/features.css"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="feature-main"><nav class="feature-nav"><a href="/admin/dashboard">Tổng quan</a><a href="/admin/products">Sản phẩm</a><a href="/admin/categories">Danh mục</a><a href="/admin/orders">Đơn hàng</a><a href="/admin/vouchers">Voucher</a><a href="/admin/service-requests">Hủy / hoàn tiền</a><a href="/admin/wallets">Ví</a><a href="/admin/customers">Khách hàng</a><a href="/admin/reviews">Đánh giá</a></nav><h1>Yêu cầu hủy / hoàn tiền</h1><p class="notice success" th:if="${success}" th:text="${success}"></p><p class="notice error" th:if="${error}" th:text="${error}"></p><p th:if="${requests.isEmpty()}">Chưa có yêu cầu.</p><section class="feature-card" th:each="r:${requests}"><h2><a th:href="@{/admin/orders/{id}(id=${r.order.id})}" th:text="${'Đơn #' + r.order.id}"></a></h2><p th:text="${r.user.email + ' · ' + r.type + ' · ' + r.status}"></p><p th:text="${r.reason}"></p><p th:text="${r.adminNote}"></p><form class="feature-form" th:if="${r.status == 'PENDING'}" th:action="@{/admin/service-requests/{id}(id=${r.id})}" method="post"><label>Quyết định<select name="decision"><option value="APPROVED">Chấp thuận</option><option value="REJECTED">Từ chối</option></select></label><label>Phản hồi<textarea name="note" maxlength="1000"></textarea></label><button>Xử lý yêu cầu</button></form></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
