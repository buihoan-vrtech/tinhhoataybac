<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ví và giao dịch | Tinh Hoa Tây Bắc</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/features.css"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="feature-main"><nav class="feature-nav"><a href="/admin/dashboard">Tổng quan</a><a href="/admin/products">Sản phẩm</a><a href="/admin/categories">Danh mục</a><a href="/admin/orders">Đơn hàng</a><a href="/admin/vouchers">Voucher</a><a href="/admin/service-requests">Hủy / hoàn tiền</a><a href="/admin/wallets">Ví</a><a href="/admin/customers">Khách hàng</a><a href="/admin/reviews">Đánh giá</a></nav><h1>Ví và giao dịch</h1><p class="notice success" th:if="${success}" th:text="${success}"></p><p class="notice error" th:if="${error}" th:text="${error}"></p><section class="feature-card"><h2>Số dư ví</h2><table><tr th:each="w:${wallets}"><td th:text="${w.user.email}"></td><td th:text="${w.balance}"></td></tr></table></section><section class="feature-card"><h2>100 giao dịch mới nhất</h2><table><tr th:each="t:${transactions}"><td th:text="${t.wallet.user.email}"></td><td th:text="${t.type}"></td><td th:text="${t.amount}"></td><td th:text="${t.description}"></td><td th:text="${t.createdAt}"></td></tr></table></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
