<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tổng quan quản trị | Tinh Hoa Tây Bắc</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/features.css"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="feature-main"><nav class="feature-nav"><a href="/admin/dashboard">Tổng quan</a><a href="/admin/products">Sản phẩm</a><a href="/admin/categories">Danh mục</a><a href="/admin/orders">Đơn hàng</a><a href="/admin/vouchers">Voucher</a><a href="/admin/service-requests">Hủy / hoàn tiền</a><a href="/admin/wallets">Ví</a><a href="/admin/customers">Khách hàng</a><a href="/admin/reviews">Đánh giá</a></nav><h1>Tổng quan quản trị</h1><p class="notice success" th:if="${success}" th:text="${success}"></p><p class="notice error" th:if="${error}" th:text="${error}"></p><div class="feature-stats"><section class="feature-card">Doanh thu đã thanh toán<strong th:text="${#numbers.formatDecimal(revenue,0,'POINT',0,'COMMA') + ' đ'}"></strong></section><section class="feature-card">Đơn hàng<strong th:text="${orderCount}"></strong></section><section class="feature-card">Sản phẩm<strong th:text="${productCount}"></strong></section><section class="feature-card">Khách hàng<strong th:text="${userCount}"></strong></section></div><section class="feature-card"><h2>Đơn mới nhất</h2><table><tr th:each="o:${orders}"><td><a th:href="@{/admin/orders/{id}(id=${o.id})}" th:text="${'#' + o.id}"></a></td><td th:text="${o.customerName}"></td><td th:text="${o.totalAmount}"></td><td th:text="${o.orderStatusLabel}"></td></tr></table></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
