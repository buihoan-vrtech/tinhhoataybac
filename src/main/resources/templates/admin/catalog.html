<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý sản phẩm | Tinh Hoa Tây Bắc</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/features.css"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="feature-main"><nav class="feature-nav"><a href="/admin/dashboard">Tổng quan</a><a href="/admin/products">Sản phẩm</a><a href="/admin/categories">Danh mục</a><a href="/admin/orders">Đơn hàng</a><a href="/admin/vouchers">Voucher</a><a href="/admin/service-requests">Hủy / hoàn tiền</a><a href="/admin/wallets">Ví</a><a href="/admin/customers">Khách hàng</a><a href="/admin/reviews">Đánh giá</a></nav><h1>Quản lý sản phẩm</h1><p class="notice success" th:if="${success}" th:text="${success}"></p><p class="notice error" th:if="${error}" th:text="${error}"></p><section class="feature-card"><h2 th:text="${product.id == null ? 'Thêm sản phẩm' : 'Sửa sản phẩm'}"></h2><form class="feature-form" th:action="@{/admin/products/save}" method="post" enctype="multipart/form-data" th:object="${product}"><input type="hidden" th:field="*{id}"><label>Tên sản phẩm<input th:field="*{name}" required maxlength="255"></label><label>Danh mục<select name="categoryId"><option value="">Chưa phân loại</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${product.category != null and product.category.id == c.id}"></option></select></label><label>Giá gốc (đ)<input type="number" min="1" step="1" th:field="*{price}" required></label><label>Tồn kho<input type="number" min="0" step="0.01" th:field="*{stock}" required></label><label>Giá khuyến mãi<input type="number" min="0" th:field="*{promotionPrice}"></label><label>Bắt đầu khuyến mãi<input type="datetime-local" th:field="*{promotionStartsAt}"></label><label>Số lượng tối thiểu<input type="number" min="0.01" step="0.01" th:field="*{minQuantity}" required></label><label>Bước số lượng<input type="number" min="0.01" step="0.01" th:field="*{quantityStep}" required></label><label>Hết khuyến mãi<input type="datetime-local" th:field="*{promotionExpiresAt}"></label><label>Đơn vị<input th:field="*{unit}"></label><label>Ảnh chính (đường dẫn)<input th:field="*{image}"></label><label>Tải ảnh chính<input name="imageFile" type="file" accept="image/png,image/jpeg"></label><label>Tải ảnh thư viện<input name="galleryFiles" type="file" multiple accept="image/png,image/jpeg"></label><label>Mô tả<textarea th:field="*{description}" maxlength="2000"></textarea></label><label>Thêm ảnh thư viện (mỗi dòng một đường dẫn)<textarea name="gallery"></textarea></label><label><span><input type="checkbox" th:field="*{featured}"> Sản phẩm nổi bật</span></label><button>Lưu sản phẩm</button></form></section><section class="feature-card"><table><thead><tr><th>Sản phẩm</th><th>Giá</th><th>Tồn</th><th>Thao tác</th></tr></thead><tbody><tr th:each="p:${products}"><td th:text="${p.name}"></td><td th:text="${p.effectivePrice}"></td><td th:text="${p.stock}"></td><td><a th:href="@{/admin/products(edit=${p.id})}">Sửa</a> <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post" onsubmit="return confirm('Xóa sản phẩm này?')"><button>Xóa</button></form></td></tr></tbody></table></section><section class="feature-card" th:if="${product.id != null}"><h2>Ảnh thư viện</h2><div th:each="i:${gallery}"><img th:src="${i.url}" alt="Ảnh sản phẩm" style="width:120px;height:120px;object-fit:cover"><form th:action="@{/admin/products/{id}/gallery/{imageId}/delete(id=${product.id},imageId=${i.id})}" method="post"><button>Xóa ảnh khỏi thư viện</button></form></div></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
