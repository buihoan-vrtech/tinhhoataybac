<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết khách hàng | Tinh Hoa Tây Bắc</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/features.css"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="feature-main"><nav class="feature-nav"><a href="/admin/dashboard">Tổng quan</a><a href="/admin/products">Sản phẩm</a><a href="/admin/categories">Danh mục</a><a href="/admin/orders">Đơn hàng</a><a href="/admin/vouchers">Voucher</a><a href="/admin/service-requests">Hủy / hoàn tiền</a><a href="/admin/wallets">Ví</a><a href="/admin/customers">Khách hàng</a><a href="/admin/reviews">Đánh giá</a></nav><h1>Chi tiết khách hàng</h1><p class="notice success" th:if="${success}" th:text="${success}"></p><p class="notice error" th:if="${error}" th:text="${error}"></p><section class="feature-card"><h2 th:text="${customer.fullName}"></h2><p th:text="${customer.email}"></p><h2 th:text="${'Số dư ví: ' + wallet.balance + ' đ'}"></h2><form class="feature-form" th:action="@{/admin/customers/{id}/wallet/adjustment(id=${customer.id})}" method="post"><label>Loại điều chỉnh<select name="direction"><option value="credit">Cộng tiền</option><option value="debit">Trừ tiền</option></select></label><label>Số tiền<input type="number" name="amount" min="1" max="100000000" required></label><label>Lý do<textarea name="note" required maxlength="500"></textarea></label><button>Điều chỉnh số dư</button></form></section><section class="feature-card"><h2>Yêu cầu nạp tiền</h2><div th:each="t:${topUps}"><strong th:text="${t.paymentCode + ' · ' + t.amount + ' đ · ' + t.status}"></strong><form th:if="${t.status == 'PENDING'}" class="feature-form" th:action="@{/admin/customers/{id}/top-ups/{topUpId}/review(id=${customer.id},topUpId=${t.id})}" method="post"><label>Quyết định<select name="decision"><option value="approve">Duyệt nạp</option><option value="reject">Từ chối</option></select></label><label>Lý do<textarea name="note" required maxlength="500"></textarea></label><label><span><input type="checkbox" name="received" value="true"> Đã nhận đủ tiền vào ngân hàng</span></label><button>Xử lý</button></form></div></section><section class="feature-card"><h2>Lịch sử ví</h2><table><tr th:each="t:${transactions}"><td th:text="${t.type}"></td><td th:text="${t.amount}"></td><td th:text="${t.description}"></td><td th:text="${t.createdAt}"></td></tr></table></section><section class="feature-card"><h2>Đơn hàng</h2><p th:each="o:${orders}"><a th:href="@{/admin/orders/{id}(id=${o.id})}" th:text="${'Đơn #' + o.id + ' · ' + o.orderStatus}"></a></p></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
