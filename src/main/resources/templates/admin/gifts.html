<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combo &amp; hộp quà | Quản trị</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/features.css"><link rel="stylesheet" href="/css/gifts.css"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="feature-main"><nav class="feature-nav"><a href="/admin/dashboard">Tổng quan</a><a href="/admin/products">Sản phẩm</a><a href="/admin/gifts">Combo &amp; hộp quà</a><a href="/admin/orders">Đơn hàng</a></nav><h1>Combo &amp; hộp quà</h1><p class="notice error" th:if="${error}" th:text="${error}"></p><section class="feature-card"><h2 th:text="${bundle.id == null ? 'Tạo combo' : 'Sửa combo'}"></h2><form class="feature-form" th:action="@{/admin/gifts/bundles/save}" method="post"><input type="hidden" name="id" th:value="${bundle.id}"><label>Tên combo<input name="name" required maxlength="150" th:value="${bundle.name}"></label><label>Giới thiệu<textarea name="description" maxlength="1000" th:text="${bundle.description}"></textarea></label><div class="gift-components"><div th:each="n:${#numbers.sequence(0,5)}"><label th:for="${'bundle-product-'+n}" th:text="${'Món ' + (n+1)}"></label><select name="productIds" th:id="${'bundle-product-'+n}"><option value="">Không chọn</option><option th:each="p:${products}" th:value="${p.id}" th:text="${p.name + ' · ' + (p.variantLabel ?: '')}" th:selected="${#lists.size(bundle.components)>n and bundle.components[n].product.id==p.id}"></option></select><label>Số lượng<input name="quantities" type="number" min="0.01" step="0.01" th:value="${#lists.size(bundle.components)>n ? bundle.components[n].quantity : 1}" required></label></div></div><label><span><input name="active" type="checkbox" value="true" th:checked="${bundle.active}"> Hiển thị combo</span></label><p>Tổng giá tự tính theo các món. Tồn kho và lô của từng món được kiểm tra khi đặt hàng.</p><button>Lưu combo</button></form></section><section class="feature-card"><h2>Danh sách combo</h2><table><thead><tr><th>Combo</th><th>Tổng giá</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="b:${bundles}"><td th:text="${b.name}"></td><td th:text="${b.price}"></td><td th:text="${b.active ? 'Đang hiển thị' : 'Ẩn'}"></td><td><a th:href="@{/admin/gifts(edit=${b.id})}">Sửa</a></td></tr></tbody></table></section><section class="feature-card"><h2>Hộp / gói quà</h2><form class="feature-form" th:each="w:${wraps}" th:action="@{/admin/gifts/wraps/save}" method="post"><input name="id" type="hidden" th:value="${w.id}"><label>Tên<input name="name" th:value="${w.name}" maxlength="100" required></label><label>Mô tả<input name="description" th:value="${w.description}" maxlength="500"></label><label>Phí (đ)<input name="price" type="number" step="1" min="0" th:value="${w.price}" required></label><label><span><input name="active" type="checkbox" value="true" th:checked="${w.active}"> Cho khách chọn</span></label><button>Lưu gói quà</button></form><h3>Thêm lựa chọn</h3><form class="feature-form" th:action="@{/admin/gifts/wraps/save}" method="post"><label>Tên<input name="name" required maxlength="100"></label><label>Mô tả<input name="description" maxlength="500"></label><label>Phí (đ)<input name="price" type="number" step="1" min="0" required></label><label><span><input name="active" type="checkbox" value="true"> Cho khách chọn</span></label><button>Thêm gói quà</button></form></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
