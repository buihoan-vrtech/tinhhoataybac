<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combo &amp; quà tặng | Tinh Hoa Tây Bắc</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/gifts.css"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container gift-page"><p class="gift-eyebrow">GỬI HƯƠNG VỊ · TRAO TÌNH CẢM</p><h1>Combo đặc sản &amp; quà tặng</h1><p>Chọn những món hợp nhau cho bữa nhà hoặc gửi tặng người thân. Thêm hộp quà và lời chúc khi thanh toán.</p><p role="alert" th:if="${error}" th:text="${error}"></p><p th:if="${#lists.isEmpty(bundles)}">Các combo đang được chuẩn bị. <a href="/products">Khám phá sản phẩm</a></p><div class="gift-grid"><article class="gift-card" th:each="b:${bundles}"><div class="gift-photos"><img th:each="c:${b.components}" th:src="${c.product.image}" th:alt="${c.product.name}" loading="lazy"></div><h2 th:text="${b.name}"></h2><p th:text="${b.description}"></p><ul><li th:each="c:${b.components}"><a th:href="@{/products/{id}(id=${c.product.id})}" th:text="${c.product.name}"></a><small th:text="${' · ' + #numbers.formatDecimal(c.quantity,0,2) + ' ' + (c.product.unit ?: 'sản phẩm') + (c.product.variantLabel == null ? '' : ' · ' + c.product.variantLabel)}"></small></li></ul><strong class="gift-price" th:text="${#numbers.formatDecimal(b.price,0,'POINT',0,'COMMA') + ' đ'}"></strong><p class="gift-note">Tổng giá các món hiện tại, chưa gồm giao hàng và hộp quà.</p><form th:action="@{/combos/{id}/add(id=${b.id})}" method="post"><button th:disabled="${!b.available}" th:text="${b.available ? 'Thêm combo vào giỏ' : 'Tạm hết hàng'}"></button></form></article></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
