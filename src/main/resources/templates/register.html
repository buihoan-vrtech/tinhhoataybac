<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đăng ký | Tinh Hoa Tây Bắc</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>


<section class="auth-v2-page auth-v2-register-page">

    <div class="auth-v2-decoration auth-v2-decoration-left"></div>
    <div class="auth-v2-decoration auth-v2-decoration-right"></div>


    <div class="auth-v2-card auth-v2-register-card">


        <div class="auth-v2-brand">

            <div class="auth-v2-logo">
                ⛰
            </div>

            <div class="auth-v2-brand-name">
                TINH HOA
            </div>

            <div class="auth-v2-brand-sub">
                TÂY BẮC
            </div>

        </div>


        <div class="auth-v2-heading">

            <span>
                TRỞ THÀNH THÀNH VIÊN
            </span>

            <h1>
                Tạo tài khoản
            </h1>

            <p>
                Đăng ký tài khoản để mua sắm nhanh hơn và sử dụng đầy đủ tiện ích.
            </p>

        </div>


        <div class="auth-v2-error"
             th:if="${error != null}"
             th:text="${error}">

            Có lỗi xảy ra

        </div>


        <form th:action="@{/register}"
              method="post"
              class="auth-v2-form">


            <div class="auth-v2-field">

                <label>
                    Họ và tên
                </label>

                <div class="auth-v2-input">

                    <div class="auth-v2-input-icon">
                        👤
                    </div>

                    <input type="text"
                           name="fullName"
                           required
                           th:value="${fullName}"
                           placeholder="Nguyễn Văn A">

                </div>

            </div>


            <div class="auth-v2-field">

                <label>
                    Email
                </label>

                <div class="auth-v2-input">

                    <div class="auth-v2-input-icon">
                        ✉
                    </div>

                    <input type="email"
                           name="email"
                           required
                           th:value="${email}"
                           placeholder="example@gmail.com">

                </div>

            </div>


            <div class="auth-v2-field">

                <label>
                    Số điện thoại
                </label>

                <div class="auth-v2-input">

                    <div class="auth-v2-input-icon">
                        ☎
                    </div>

                    <input type="tel"
                           name="phone"
                           th:value="${phone}"
                           placeholder="0912345678">

                </div>

            </div>


            <div class="auth-v2-field">

                <label>
                    Mật khẩu
                </label>

                <div class="auth-v2-input">

                    <div class="auth-v2-input-icon">
                        🔒
                    </div>

                    <input type="password"
                           name="password"
                           id="registerPassword"
                           required
                           minlength="6"
                           placeholder="Ít nhất 6 ký tự">

                    <button type="button"
                            class="auth-v2-eye"
                            onclick="toggleRegisterPassword()">

                        👁

                    </button>

                </div>

            </div>


            <div class="auth-v2-field">

                <label>
                    Xác nhận mật khẩu
                </label>

                <div class="auth-v2-input">

                    <div class="auth-v2-input-icon">
                        🔐
                    </div>

                    <input type="password"
                           name="confirmPassword"
                           required
                           minlength="6"
                           placeholder="Nhập lại mật khẩu">

                </div>

            </div>


            <label class="auth-v2-agreement">

                <input type="checkbox"
                       required>

                <span>
                    Tôi đồng ý với
                    <a href="#">
                        Điều khoản sử dụng
                    </a>
                    và
                    <a href="#">
                        Chính sách bảo mật
                    </a>
                </span>

            </label>


            <button type="submit"
                    class="auth-v2-submit">

                <span>
                    Tạo tài khoản
                </span>

                <strong>
                    →
                </strong>

            </button>


        </form>


        <div class="auth-v2-divider">

            <span>
                hoặc
            </span>

        </div>


        <div class="auth-v2-register">

            <span>
                Bạn đã có tài khoản?
            </span>

            <a th:href="@{/login}">
                Đăng nhập
            </a>

        </div>


        <a th:href="@{/}"
           class="auth-v2-home">

            ← Quay lại trang chủ

        </a>


    </div>

</section>


<div th:replace="~{fragments/footer :: footer}"></div>


<script>

    function toggleRegisterPassword() {

        const input =
            document.getElementById("registerPassword");

        if (input.type === "password") {
            input.type = "text";
        } else {
            input.type = "password";
        }

    }

</script>


</body>
</html>
