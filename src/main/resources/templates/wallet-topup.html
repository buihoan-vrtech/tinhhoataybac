<!DOCTYPE html>

<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Nạp tiền vào ví | Tinh Hoa Tây Bắc
    </title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>


<body>


<div th:replace="~{fragments/header :: header}">
</div>


<section style="
        max-width: 650px;
        margin: 60px auto;
        padding: 30px;
">


    <a th:href="@{/wallet}"
       style="
       text-decoration: none;
       color: #355c3a;
       ">

        ← Quay lại ví

    </a>


    <div style="
        background: white;
        margin-top: 20px;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    ">


        <p style="
            color: #b58b3a;
            font-weight: 700;
            margin-bottom: 8px;
        ">

            VÍ TINH HOA

        </p>


        <h1 style="
            margin-top: 0;
            color: #24472b;
        ">

            Nạp tiền vào ví

        </h1>


        <p>

            Nhập số tiền bạn muốn nạp.
            Thanh toán sẽ được thực hiện
            qua SePay.

        </p>


        <div th:if="${error != null}"
             style="
             background: #ffe8e8;
             padding: 12px;
             margin: 20px 0;
             border-radius: 8px;
             color: #a60000;
             ">

            <span th:text="${error}">
                Có lỗi xảy ra
            </span>

        </div>


        <div th:if="${param.paymentError}"
             style="
             background: #ffe8e8;
             padding: 12px;
             margin: 20px 0;
             border-radius: 8px;
             ">

            Thanh toán không thành công.

        </div>


        <div th:if="${param.cancelled}"
             style="
             background: #fff4d6;
             padding: 12px;
             margin: 20px 0;
             border-radius: 8px;
             ">

            Bạn đã hủy thanh toán.

        </div>


        <form th:action="@{/wallet/topup}"
              method="post">


            <label style="
                display:block;
                margin-bottom: 8px;
                font-weight: 700;
            ">

                Số tiền muốn nạp

            </label>


            <input type="number"
                   name="amount"
                   min="10000"
                   step="1000"
                   placeholder="Ví dụ: 100000"
                   th:value="${amount}"
                   required

                   style="
                   width:100%;
                   box-sizing:border-box;
                   padding:15px;
                   border:1px solid #ccc;
                   border-radius:10px;
                   font-size:18px;
                   ">


            <small style="
                display:block;
                margin-top:8px;
                color:#777;
            ">

                Tối thiểu 10.000 ₫

            </small>


            <div style="
                display:grid;
                grid-template-columns:repeat(3,1fr);
                gap:10px;
                margin-top:20px;
            ">


                <button type="button"
                        onclick="
                        document.querySelector('[name=amount]').value=50000
                        ">

                    50.000 ₫

                </button>


                <button type="button"
                        onclick="
                        document.querySelector('[name=amount]').value=100000
                        ">

                    100.000 ₫

                </button>


                <button type="button"
                        onclick="
                        document.querySelector('[name=amount]').value=500000
                        ">

                    500.000 ₫

                </button>


            </div>


            <button type="submit"

                    style="
                    width:100%;
                    margin-top:25px;
                    padding:16px;
                    border:0;
                    border-radius:10px;
                    background:#355c3a;
                    color:white;
                    font-size:16px;
                    font-weight:700;
                    cursor:pointer;
                    ">

                Tiếp tục thanh toán

            </button>


        </form>


    </div>


</section>


<div th:replace="~{fragments/footer :: footer}">
</div>


</body>
</html>
