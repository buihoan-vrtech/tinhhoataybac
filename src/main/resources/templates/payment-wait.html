<!DOCTYPE html>

<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Đang xác nhận thanh toán
    </title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>


<body>


<div th:replace="~{fragments/header :: header}">
</div>


<section class="qr-payment-page">

    <div class="container">


        <div class="payment-success-box"
             id="waitingBox">


            <div class="payment-spinner"
                 style="margin:0 auto 25px;">
            </div>


            <h1>
                Đang xác nhận thanh toán
            </h1>


            <p>
                SePay đang kiểm tra giao dịch của bạn.
            </p>


            <div class="payment-success-code">

                Mã thanh toán:

                <strong th:text="${order.paymentCode}">
                    THB1
                </strong>

            </div>


            <p id="payment-status-message" role="status" aria-live="polite" class="payment-redirect-text">

                Không cần tải lại trang.
                Hệ thống sẽ tự cập nhật.

            </p>


            <p><a th:href="@{/account/orders/{id}(id=${order.id})}">Xem đơn hàng</a> · <a href="/account/orders">Danh sách đơn hàng</a></p>
        </div>

        <div class="payment-success-box"
             id="successBox"
             style="display:none;">


            <div class="payment-success-icon">

                ✓

            </div>


            <h1>
                Thanh toán thành công
            </h1>


            <p>
                Đơn hàng đã được xác nhận.
            </p>


            <p class="payment-redirect-text">

                Đang chuyển tới trang hoàn tất đơn hàng...

            </p>


        </div>


    </div>

</section>


<div th:replace="~{fragments/footer :: footer}">
</div>


<script th:inline="javascript">
const orderId=/*[[${order.id}]]*/0;
let timer,checking=false,stopped=false,attempts=0;
const message=document.getElementById('payment-status-message');
async function checkPayment(){
 if(checking||stopped)return;checking=true;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000);
 try{const response=await fetch('/api/payment/status/'+orderId,{cache:'no-store',signal:controller.signal});
 if(response.redirected||response.status===401||response.status===403){stopped=true;message.textContent='Phiên đăng nhập đã hết hạn. Đăng nhập lại để xem đơn hàng.';return;}
 if(!response.ok)throw Error();const data=await response.json();
 if(data.paid){stopped=true;document.getElementById('waitingBox').style.display='none';document.getElementById('successBox').style.display='block';setTimeout(()=>location.href='/order-success/'+orderId,1800);return;}
 if(data.orderStatus==='CANCELLED'||data.paymentStatus==='REFUNDED'){stopped=true;message.textContent='Đơn đã hủy hoặc hoàn tiền. Xem chi tiết đơn hàng để được hỗ trợ.';return;}
 if(data.expiresAt&&Date.parse(data.expiresAt)<=Date.now()){stopped=true;message.textContent='Đã hết thời gian thanh toán. Nếu đã chuyển tiền, vui lòng liên hệ hỗ trợ và cung cấp mã đơn.';return;}
 message.textContent='Đang chờ xác nhận từ SePay. Không cần tải lại trang.';
 }catch(e){message.textContent='Chưa kết nối được để kiểm tra. Hệ thống sẽ thử lại; bạn có thể xem trạng thái trong đơn hàng.';}finally{clearTimeout(timeout);checking=false;if(!stopped&&++attempts<150)timer=setTimeout(checkPayment,3000);else if(!stopped){stopped=true;message.textContent='Chưa nhận xác nhận. Vui lòng kiểm tra trong đơn hàng hoặc liên hệ hỗ trợ trước khi thanh toán lại.';}}}
checkPayment();window.addEventListener('pagehide',()=>{stopped=true;clearTimeout(timer);});
</script>


</body>

</html>
